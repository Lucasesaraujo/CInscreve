version: '3.8'

services:
  backend:
    build: ./backend
    container_name: backend_cinscreve
    restart: unless-stopped
    ports:
      - "3002:3002" # altere para a porta real do backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - boraimpactar2
    command: npm run start

  frontend:
    build: ./frontend
    container_name: frontend_cinscreve
    restart: unless-stopped
    ports:
      - "5002:5002"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:5002 # use o nome do serviço para acessar o backend
    networks:
      - boraimpactar2

networks:
  boraimpactar2:
    external: true